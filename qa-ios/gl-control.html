<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGL2 render control</title>
<style>html,body{margin:0;background:#203040}canvas{display:block;width:100vw;height:100vh}</style><canvas id="canvas"></canvas><script>
const c=document.querySelector('canvas'),q=new URLSearchParams(location.search);
c.width=Math.round(innerWidth*devicePixelRatio);c.height=Math.round(innerHeight*devicePixelRatio);
window.glqa={frames:0,pixelChecks:0,pixelFailures:0,glErrors:[],events:[],compile:[],linked:false,complete:false,started:performance.now(),buffer:[c.width,c.height],requestedPreserve:q.get('preserve')!=='0'};
c.addEventListener('webglcontextlost',e=>glqa.events.push({type:e.type,at:performance.now()}));
c.addEventListener('webglcontextrestored',e=>glqa.events.push({type:e.type,at:performance.now()}));
try{
 const gl=c.getContext('webgl2',{alpha:false,depth:true,stencil:false,antialias:false,premultipliedAlpha:true,preserveDrawingBuffer:glqa.requestedPreserve,powerPreference:'default',failIfMajorPerformanceCaveat:false});
 if(!gl)throw Error('No WebGL2 context');
 glqa.attributes=gl.getContextAttributes();glqa.renderer=gl.getParameter(gl.RENDERER);glqa.maxRenderbuffer=gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);
 function shader(kind,source){const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);const ok=gl.getShaderParameter(s,gl.COMPILE_STATUS);glqa.compile.push({ok,log:gl.getShaderInfoLog(s)});if(!ok)throw Error('Shader compile failed');return s;}
 const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,'#version 300 es\nin vec2 position;void main(){gl_Position=vec4(position,0,1);}'));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;uniform vec4 color;out vec4 outputColor;void main(){outputColor=color;}'));gl.linkProgram(p);glqa.linked=gl.getProgramParameter(p,gl.LINK_STATUS);if(!glqa.linked)throw Error(gl.getProgramInfoLog(p));
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(p,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.useProgram(p);const color=gl.getUniformLocation(p,'color');
 const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texStorage2D(gl.TEXTURE_2D,1,gl.RGBA8,c.width,c.height);const depth=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,depth);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,c.width,c.height);
 const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depth);glqa.framebufferStatus=gl.checkFramebufferStatus(gl.FRAMEBUFFER);if(glqa.framebufferStatus!==gl.FRAMEBUFFER_COMPLETE)throw Error('Framebuffer incomplete');
 const pixel=new Uint8Array(4);
 function frame(now){
   if(gl.isContextLost()){glqa.lost=true;return;}
   const green=(Math.floor(glqa.frames/30)%2)===0;
   gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,c.width,c.height);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform4f(color,0,green?1:0,green?0:1,1);gl.drawArrays(gl.TRIANGLES,0,3);
   gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fbo);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);gl.blitFramebuffer(0,0,c.width,c.height,0,0,c.width,c.height,gl.COLOR_BUFFER_BIT,gl.NEAREST);
   gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);gl.readPixels(2,2,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);glqa.pixelChecks++;glqa.lastPixel=Array.from(pixel);if(pixel[1]!== (green?255:0)||pixel[2]!== (green?0:255)||pixel[3]!==255)glqa.pixelFailures++;
   const error=gl.getError();if(error!==gl.NO_ERROR&&glqa.glErrors.length<20)glqa.glErrors.push(error);glqa.frames++;glqa.elapsed=now-glqa.started;
   if(glqa.elapsed>=35000){glqa.complete=true;return;}requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}catch(e){glqa.failure=String(e);}
</script>
