      const legacy = new DOMParser().parseFromString("\u003c!doctype html\u003e\n\u003chtml lang=\u0022zh-Hant\u0022\u003e\n\u003chead\u003e\n  \u003cmeta charset=\u0022utf-8\u0022\u003e\n  \u003cmeta name=\u0022viewport\u0022 content=\u0022width=device-width, initial-scale=1\u0022\u003e\n  \u003cmeta name=\u0022referrer\u0022 content=\u0022no-referrer\u0022\u003e\n  \u003ctitle\u003e加入 1A2B 房間\u003c/title\u003e\n  \u003cstyle\u003e\n    :root { color-scheme: dark; font-family: system-ui, \u0022Microsoft JhengHei\u0022, sans-serif; background: #101925; color: #f3f7fb; }\n    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }\n    main { box-sizing: border-box; width: min(100%, 540px); padding: 32px 24px; }\n    .card { background: #1b2a39; border: 1px solid #375064; border-radius: 18px; padding: 28px; }\n    h1 { margin-top: 0; font-size: 1.8rem; }\n    p { line-height: 1.65; }\n    .room { font-size: 1.35rem; font-weight: 700; color: #7de0d4; }\n    button { min-height: 48px; padding: 10px 18px; border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 700; }\n    #open { background: #7de0d4; color: #10212c; }\n    #copy { background: #dce9ef; color: #10212c; }\n    .actions { display: flex; flex-wrap: wrap; gap: 12px; }\n    code { overflow-wrap: anywhere; user-select: all; }\n    .muted { color: #b9cbd4; }\n    .error { color: #ffb8b8; }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cmain\u003e\u003cdiv class=\u0022card\u0022\u003e\n    \u003ch1\u003e1A2B 房間邀請\u003c/h1\u003e\n    \u003cdiv id=\u0022valid\u0022 hidden\u003e\n      \u003cp\u003e房號：\u003cspan id=\u0022room\u0022 class=\u0022room\u0022\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\u0022muted\u0022\u003e請確認邀請來源可信。按下按鈕後，瀏覽器會詢問是否開啟已安裝的 1A2B。\u003c/p\u003e\n      \u003cdiv class=\u0022actions\u0022\u003e\u003cbutton id=\u0022open\u0022 type=\u0022button\u0022\u003e開啟 1A2B\u003c/button\u003e\u003cbutton id=\u0022copy\u0022 type=\u0022button\u0022\u003e複製邀請碼\u003c/button\u003e\u003c/div\u003e\n      \u003cp id=\u0022copy-status\u0022 role=\u0022status\u0022\u003e\u003c/p\u003e\n      \u003cp\u003e若按鈕無法使用，請開啟 1A2B，在「加入房間」貼上邀請碼：\u003c/p\u003e\n      \u003cp\u003e\u003ccode id=\u0022manual\u0022\u003e\u003c/code\u003e\u003c/p\u003e\n      \u003cp class=\u0022muted\u0022\u003eWindows 與網頁版可加入同一個正式房間。\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cp id=\u0022error\u0022 class=\u0022error\u0022 role=\u0022alert\u0022 hidden\u003e邀請連結無效。請向房主索取完整的新連結或邀請碼。\u003c/p\u003e\n    \u003cp\u003e\u003ca style=\u0022color:#7de0d4\u0022 href=\u0022https://140-120-53-5.sslip.io/\u0022\u003e直接玩網頁版 1A2B\u003c/a\u003e · \u003ca style=\u0022color:#7de0d4\u0022 href=\u0022https://github.com/Funji713/1a2b-invite/releases/latest\u0022\u003e下載 Windows 最新版\u003c/a\u003e\u003c/p\u003e\n  \u003c/div\u003e\u003c/main\u003e\n  \u003cscript src=\u0022relay.js\u0022\u003e\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n", 'text/html');

    // Keep browser zoom gestures separate from Godot's single-finger UI input.
// Godot's touch listener otherwise cancels native pinch; its pointermove
// listener also treats a finger as a hovering desktop mouse.
(() => {
    const canvas = document.getElementById('canvas');
    let pointer = 'mouse';
    let activeTouch = null;
    let zoomTap = null;
    let zoomTapScale = 1;
    let browserGesture = false;
    const zoomed = () => window.visualViewport && visualViewport.scale > 1.01;
    function touchAction() {
        // At 1x, game panels own single-finger scrolling. Once zoomed, the
        // browser owns panning as well as pinching the enlarged page.
        canvas.style.touchAction = zoomed() ? 'auto' : 'pinch-zoom';
        if (zoomTap && Math.abs(visualViewport.scale - zoomTapScale) > 0.01) zoomTap = null;
    }
    function forward(type, touches, changedTouches) {
        // Godot consumes these three lists without requiring a TouchEvent.
        // WebKit builds reject the TouchEvent dictionary constructor, so use
        // a plain event for this internal bridge, leaving native events intact.
        const event = new Event(type, { bubbles: true, cancelable: false });
        Object.defineProperties(event, {
            touches: { value: touches }, targetTouches: { value: touches },
            changedTouches: { value: changedTouches }
        });
        canvas.dispatchEvent(event);
    }
    function cancelGameTouch() {
        if (!activeTouch) return;
        // Godot's DOM touchcancel is an ordinary release. Its game-side bridge
        // injects a genuinely canceled touch: no button activation or fake drag.
        const rect = canvas.getBoundingClientRect();
        window.__onea2bCancelTouch?.(activeTouch.identifier,
            (activeTouch.clientX - rect.left) * canvas.width / rect.width,
            (activeTouch.clientY - rect.top) * canvas.height / rect.height);
        activeTouch = null;
    }
    function onTouch(event) {
        // Noncancelable clones reach Godot; the trusted originals remain
        // uncanceled for the browser's native gesture recognizer.
        if (!event.isTrusted) return;
        pointer = 'touch';
        event.stopImmediatePropagation();
        // A native pinch often ends with touchcancel, without a later DOM
        // touchend. The first contact of the next gesture starts fresh.
        if (event.type === 'touchstart' && event.touches.length === event.changedTouches.length) {
            cancelGameTouch();
            browserGesture = false;
            zoomTap = null;
        }
        if (event.type === 'touchcancel' || event.touches.length > 1) {
            browserGesture = true;
            zoomTap = null;
            cancelGameTouch();
        }
        if (!browserGesture && zoomed()) {
            // Keep zoomed controls tappable. Buffer the press until a real tap
            // finishes; moving fingers belong entirely to native page panning.
            if (event.type === 'touchstart') { zoomTap = event.touches[0]; zoomTapScale = visualViewport.scale; }
            if (event.type === 'touchmove' && zoomTap) {
                const current = event.touches[0];
                if (!current || Math.hypot(current.clientX - zoomTap.clientX, current.clientY - zoomTap.clientY) * zoomTapScale > 8) zoomTap = null;
            }
            if (event.type === 'touchend' && zoomTap) {
                const ended = Array.from(event.changedTouches).find(touch => touch.identifier === zoomTap.identifier);
                if (ended) { forward('touchstart', [ended], [ended]); forward('touchend', [], [ended]); }
                zoomTap = null;
            }
            if (event.touches.length === 0) browserGesture = false;
            return;
        }
        if (!browserGesture) {
            const touches = Array.from(event.touches);
            forward(event.type, touches, Array.from(event.changedTouches));
            activeTouch = touches[0] || null;
        }
        if (event.touches.length === 0) {
            activeTouch = null;
            zoomTap = null;
            browserGesture = false;
        }
    }
    for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
        canvas.addEventListener(type, onTouch, { capture: true, passive: true });
    }
    for (const type of ['pointerdown', 'pointermove', 'pointerover']) {
        window.addEventListener(type, event => {
            pointer = event.pointerType;
            if (pointer === 'touch' && type === 'pointermove') event.stopImmediatePropagation();
        }, { capture: true, passive: true });
    }
    // Uncanceled taps can also produce compatibility mouse events. Godot
    // already receives the touch and its own mouse emulation; prevent doubles.
    // A real mouse/pen pointer event immediately restores mouse handling,
    // including on touchscreen laptops, without a timer or device-wide lock.
    for (const type of ['mousedown', 'mouseup', 'mousemove', 'mouseover', 'click']) {
        window.addEventListener(type, event => {
            if (event.target === canvas && (pointer === 'touch' || event.sourceCapabilities?.firesTouchEvents)) {
                event.stopImmediatePropagation();
                // Suppressing propagation alone still lets mousedown's default
                // focus steal Godot's newly opened native input back to canvas.
                if (type === 'mousedown' && event.cancelable) event.preventDefault();
            }
        }, { capture: true, passive: false });
    }
    if (window.visualViewport) {
        visualViewport.addEventListener('resize', touchAction);
        visualViewport.addEventListener('scroll', () => { zoomTap = null; });
    }
    touchAction();
})();

    // Canvas resize policy is None: the browser's visible area owns its bounds.
// Mobile keyboards can shrink visualViewport while innerHeight stays unchanged.
(() => {
    const canvas = document.getElementById('canvas');
    document.documentElement.style.overflow = 'hidden';
    document.documentElement.style.height = '100%';
    document.body.style.position = 'fixed';
    document.body.style.inset = '0';
    document.body.style.overflow = 'hidden';
    let pending = false;
    function resize() {
        pending = false;
        const view = window.visualViewport;
        // Keep browser pinch zoom available without resizing the game underneath it.
        if (view && Math.abs(view.scale - 1) > 0.01) return;
        const width = Math.max(1, Math.round(view ? view.width : innerWidth));
        const height = Math.max(1, Math.round(view ? view.height : innerHeight));
        const left = view ? Math.max(0, Math.min(view.offsetLeft, innerWidth - width)) : 0;
        const top = view ? Math.max(0, Math.min(view.offsetTop, innerHeight - height)) : 0;
        const ratio = window.devicePixelRatio || 1;
        canvas.style.position = 'absolute';
        canvas.style.left = `${window.scrollX + left}px`;
        canvas.style.top = `${window.scrollY + top}px`;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        const bufferWidth = Math.round(width * ratio);
        const bufferHeight = Math.round(height * ratio);
        // Assigning even an unchanged buffer size clears a canvas.
        if (canvas.width !== bufferWidth) canvas.width = bufferWidth;
        if (canvas.height !== bufferHeight) canvas.height = bufferHeight;
    }
    function schedule() {
        if (!pending) {
            pending = true;
            requestAnimationFrame(resize);
        }
    }
    window.addEventListener('resize', schedule);
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('pageshow', schedule);
    if (window.visualViewport) {
        visualViewport.addEventListener('resize', schedule);
        visualViewport.addEventListener('scroll', schedule);
    }
    resize();
})();

    const backend = 'https://140-120-53-5.sslip.io';
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const message = document.getElementById('message');
    const recovery = document.getElementById('recovery');
    document.getElementById('retry').href = location.href;
    const room = query.get('room') || '';
    if (/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{5}$/.test(room)) document.getElementById('direct').href += '?room=' + room;
    let failed = false;
    let deadline;
    const started = Date.now();
    let downloaded = 0;
    function fail() {
      failed = true; clearTimeout(deadline);
      status.hidden = false; progress.hidden = true; recovery.hidden = false;
      message.textContent = '遊戲暫時無法載入。請檢查網路後重試，或使用備用入口。';
    }
    // No automatic reload/retry, so a service outage never loops navigation.
    function armDeadline() { clearTimeout(deadline); deadline = setTimeout(fail, Math.max(0, Math.min(45000, 180000 - (Date.now() - started)))); }
    const loader = document.createElement('script');
    loader.src = backend + '/index.js'; loader.crossOrigin = 'anonymous';
    loader.onerror = fail;
    loader.onload = async () => {
      if (failed) return;
      try {
        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length) throw new Error('Unsupported browser');
        const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":4656088,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
        config.executable = backend + '/index';
        config.mainPack = backend + '/index.pck';
        config.fileSizes = Object.fromEntries(Object.entries(config.fileSizes).map(([name, size]) => [backend + '/' + name, size]));
        config.onProgress = (current, total) => {
          if (failed) return;
          if (current > downloaded) { downloaded = current; armDeadline(); }
          if (total > 0) { progress.max = total; progress.value = current; }
        };
        const engine = new Engine(config);
        await engine.startGame();
        if (!failed) { clearTimeout(deadline); status.hidden = true; }
      } catch (_) { fail(); }
    };
    armDeadline(); document.body.appendChild(loader);
  })();
