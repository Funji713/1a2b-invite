name: iOS Simulator QA
on:
  push:
    branches: [qa-ios-remaining-20261024]
    paths: [.github/workflows/ios-qa.yml, qa-ios/**]
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Boot actual iOS Simulator and open live Safari
        run: |
          mkdir -p qa-ios-evidence
          xcodebuild -version | tee qa-ios-evidence/xcode.txt
          xcrun simctl list -j > qa-ios-evidence/simctl.json
          UDID=$(python3 - <<'PY'
          import json
          d=json.load(open('qa-ios-evidence/simctl.json'))
          for runtime, devices in sorted(d['devices'].items(),reverse=True):
              if 'iOS' not in runtime: continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      print(device['udid']);raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )
          echo "$UDID" > qa-ios-evidence/udid.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl openurl "$UDID" 'https://funji713.github.io/1a2b-invite/'
          sleep 35
          xcrun simctl io "$UDID" screenshot qa-ios-evidence/safari.png
      - name: Preserve non-sensitive simulator evidence on QA branch
        if: always()
        run: |
          git config user.name "1A2B QA"
          git config user.email "qa@users.noreply.github.com"
          git add qa-ios-evidence
          git diff --cached --quiet || git commit -m "Record actual iOS Simulator smoke evidence"
          git push origin HEAD:qa-ios-remaining-20261024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence
          path: qa-ios-evidence
